[tool.poetry]
name = "behaviour-diversity-counter"
version = "0.2.0"
description = "Behaviour diversity counter aimed at unified planning interface"
authors = ["MFaisalZaki <mustafa.faisal.eng@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "behaviour_diversity_counter" },
    # The paper's evaluation: one flat package, its own CLI (`bdcexp`).
    { include = "bdc_experiments", from = "experiments" },
]

[tool.poetry.dependencies]
# Capped below 3.14: unified-planning pulls in scipy, which has no 3.14+ wheels
# and fails to build from source there.
python = ">=3.10,<3.14"
# The only three packages the library imports.
unified-planning = "^1.3.0"
lark = "^1.1.9"
# Greedy extraction holds its plan-by-plan distances in an ndarray and picks
# with argmax. Lower bound rather than a caret: the calls used are long-stable
# (triu_indices, ix_, isin, setdiff1d, argmax), so 1.x serves as well as 2.x,
# and a caret on either would refuse the other.
numpy = ">=1.24"
# `bdc_experiments.config` reads one TOML file. tomllib is standard from 3.11;
# below that its backport stands in, and nothing else changes.
tomli = { version = "^2.0", python = "<3.11" }

# Optional extras, read by the report stage of `bdc_experiments` only: the
# run stage is the standard library plus this library.
matplotlib = { version = "^3.6", optional = true }
scipy = { version = "^1.10", optional = true }

[tool.poetry.extras]
analysis = ["matplotlib", "scipy"]

# Planner engines. Not imported by this package -- it consumes plans rather than
# producing them -- so they are optional: `poetry install --with planners`.
[tool.poetry.group.planners]
optional = true

[tool.poetry.group.planners.dependencies]
up-symk = "^1.3.0"
up-fast-downward = "^0.4.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.poetry.scripts]
bdcexp = 'bdc_experiments.cli:main'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "experiments"]
