[tool.poetry]
name = "behaviour-diversity-counter"
version = "0.1.0"
description = "Behaviour diversity counter aimed at unified planning interface"
authors = ["MFaisalZaki <mustafa.faisal.eng@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
# Capped below 3.14: unified-planning pulls in scipy, which has no 3.14+ wheels
# and fails to build from source there.
python = ">=3.10,<3.14"
# The only two packages the library imports.
unified-planning = "^1.3.0"
lark = "^1.1.9"

# Planner engines. Not imported by this package -- it consumes plans rather than
# producing them -- so they are optional: `poetry install --with planners`.
[tool.poetry.group.planners]
optional = true

[tool.poetry.group.planners.dependencies]
up-symk = "^1.3.0"
up-fast-downward = "^0.4.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
# paper-experiments is on the path so the golden tests can reach the
# plan-level baseline in paperexps/selectors.py.
pythonpath = [".", "paper-experiments"]
