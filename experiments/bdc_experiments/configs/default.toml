# The sweep as it is meant to be run on the cluster. Section 14 of the plan
# lists the settings the author confirms before the sweep; all are here, so
# confirming them is an edit to this file and never to the code.

[run]
seed = 20260913
results_dir = "runs/default"
time_limit_generation_s = 1800
memory_limit_generation_mb = 8000
# Phase two, per task: a task that runs away is a recorded failure, and this
# is the wall clock at which it becomes one. Generous for the timing tasks,
# which remap a 10,000-plan pool `[e3].repeats` times over.
time_limit_selection_s = 3600

[benchmark]
source = "https://github.com/AI-Planning/classical-domains.git"
commit = "4bd0b42d89ea02bd38af6f93cf20a0ab0cbda9d9"
# Directory names under classical/, not the api.py `name` field: two
# directories can carry the same name (logistics98 and logistics00 both say
# "logistics") and the directory is what makes an instance id unique.
# logistics00 is deliberately not here: its domain file declares
# `(in ?obj ?obj)`, a repeated parameter name that unified-planning rejects,
# so no plan over it can be replayed. logistics98 is the 1998 STRIPS variant
# of the same domain and parses.
domains = ["rovers", "logistics98", "driverlog", "satellite", "depot",
           "zenotravel", "tpp", "gripper", "blocks"]
instances_per_domain = 15

[generation]
planner = "symk"
modes = ["topq"]                        # top-quality with bound q * c*
# N: plans requested per pool of the selection sweep. Phase one also
# generates the sizes of [e3].pool_sizes, which only the timing tasks read.
pool_sizes = [1000]
q_values = [1.0, 2.0]

[selection]
k_values = [3, 5, 10]
kappa_values = [1, 2, 3]

[models]
generic = { features = ["go", "cbin"], goal_cap = 6, cost_bin_width = 0.1 }
stability = { }                         # the literature's model: no knobs

[e1]
# Directory names, as in [benchmark].domains; the case study takes one
# instance per domain from the q = 2.0 pools, at k = 3 and kappa = 1.
domains = ["rovers", "logistics98", "satellite"]
min_behaviours = 6

[e2]
random_subsets = 200
weight_settings = [[0.5, 0.5], [0.25, 0.75], [0.75, 0.25]]   # rovers_astronaut only

[e3]
pool_sizes = [100, 1000, 10000]
repeats = 5
