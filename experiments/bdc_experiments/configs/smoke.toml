# The smoke sweep: the committed pools under configs/smoke_pools/, seconds to
# run, no planner and no benchmark checkout. Used by the tests and by CI.
# `bdcexp run smoke select` picks this file up by name.

[run]
seed = 20260913
results_dir = "runs/smoke"
time_limit_generation_s = 60
memory_limit_generation_mb = 4000
time_limit_selection_s = 60

[benchmark]
source = "https://github.com/AI-Planning/classical-domains.git"
commit = "4bd0b42d89ea02bd38af6f93cf20a0ab0cbda9d9"
domains = ["rovers", "driverlog", "satellite"]
instances_per_domain = 1

[generation]
planner = "symk"
modes = ["topq"]
pool_sizes = [30]
q_values = [1.0, 2.0]

[selection]
k_values = [3, 5]
kappa_values = [1, 2]

[models]
generic = { features = ["go", "cbin"], goal_cap = 3, cost_bin_width = 0.25 }
stability = { }

[e1]
domains = ["rovers", "driverlog", "satellite"]
min_behaviours = 4

[e2]
random_subsets = 25
weight_settings = [[0.5, 0.5], [0.25, 0.75]]

[e3]
pool_sizes = [30]
repeats = 2
